# Build smartdns + smartdns_ui.so for three Linux variants and pack
# each variant into a single zip containing only those two files.
#
#   smartdns-<version>-linux-x86_64-glibc.zip
#   smartdns-<version>-linux-x86_64-musl.zip
#   smartdns-<version>-linux-aarch64-glibc.zip
#
# Manual trigger only (Actions -> "Build zip packages" -> Run workflow).
# Pick the branch to build when dispatching. The zips are attached to
# the "nightly" GitHub Release (same place release.yml uploads to).
#
# All jobs prefer the repo's own third-party dependencies: OpenSSL 4.1.0
# and curl 8.23.0 are built into /opt by the repo's third_party scripts
# and picked up via LOCAL_DEPS_PREFIX=/opt, which outranks the system
# libraries in src/Makefile detection (system is only the fallback).
# Linking is the Makefile's STATIC_DEPS mode, and the /opt copies of
# OpenSSL and libcurl are built static-only (no .so files at all), so
# OpenSSL, libcurl, zlib and libcurl's own compression tail (zstd,
# brotli) are all compiled in and the binary runs on a bare system.
# libc/libgcc_s deliberately stay dynamic: the Makefile's
# full-static mode (-static) is incompatible with loading the
# smartdns_ui.so plugin via dlopen. The plugin itself is built fully
# self-contained (musl target, gcc_s replaced by static libgcc via the
# repo's ld-static-gcc.sh wrapper).
# The compression dev packages are installed BEFORE building curl
# (the same approach as the repo's Dockerfile.builder-base) so curl
# picks the features up and their archives exist at link time.
# glibc jobs run natively on GitHub runners (x86_64 and ARM64); the musl
# job runs inside Alpine, mirroring Dockerfile.builder-base-amd64.

name: Build zip packages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64-glibc
            runner: ubuntu-24.04
            container: ~
            kind: glibc
          - label: linux-aarch64-glibc
            runner: ubuntu-24.04-arm
            container: ~
            kind: glibc
          - label: linux-x86_64-musl
            runner: ubuntu-24.04
            container: alpine:3.24
            kind: musl

    steps:
      - name: Install tools (glibc runners)
        if: matrix.kind == 'glibc'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config git perl wget ca-certificates \
            zlib1g-dev libzstd-dev libbrotli-dev clang libclang-dev zip file
          # zlib1g-dev/libzstd-dev/libbrotli-dev ship the static archives
          # that the /opt libcurl.a needs at link time; the workflow
          # links them with -Bstatic, so no runtime copies are needed.

      - name: Install tools (musl, Alpine)
        if: matrix.kind == 'musl'
        run: |
          apk add --no-cache \
            build-base linux-headers musl-dev zlib-dev zlib-static \
            zstd-dev zstd-static brotli-dev brotli-static \
            pkgconf git ca-certificates perl wget bash \
            llvm-dev clang clang-dev zip file github-cli

      - name: Install Rust
        if: matrix.kind == 'glibc'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust (musl, Alpine)
        if: matrix.kind == 'musl'
        shell: bash
        run: |
          wget -qO- https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cache bindgen
        id: cache-bindgen
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/bindgen
          key: ${{ matrix.label }}-bindgen-v1

      - name: Install bindgen
        if: steps.cache-bindgen.outputs.cache-hit != 'true'
        shell: bash
        run: cargo install --force --locked bindgen-cli

      - name: Build custom dependencies into /opt (OpenSSL 4.1.0, curl 8.23.0)
        shell: bash
        run: |
          if [ "${{ matrix.kind }}" = "glibc" ]; then SUDO=sudo; else SUDO=; fi
          # Static ONLY: the scripts' "both" mode installs a shared
          # OpenSSL whose symbol set differs from the static archive
          # (separate Configure runs), and libcurl.a then references
          # symbols libssl.a lacks. With no .so in /opt at all, curl
          # configures against libssl.a and the final binary needs no
          # OpenSSL/CURL shared libraries at runtime.
          $SUDO env LOCAL_OPENSSL_INSTALL=/opt/openssl \
            sh third_party/build_openssl.sh 4.1.0 static
          $SUDO env LIBS="-ldl -lpthread -lz" LOCAL_CURL_INSTALL=/opt/curl \
            LOCAL_OPENSSL_INSTALL=/opt/openssl \
            sh third_party/build_curl.sh 8.23.0 static

      - name: Build smartdns + UI plugin
        shell: bash
        run: |
          export LOCAL_DEPS_PREFIX=/opt
          make clean || true
          make WITH_UI=1 OPTIMIZE_SIZE=1 STATIC_DEPS=1 -j"$(nproc)"

      - name: Pack zip (smartdns + smartdns_ui.so only)
        shell: bash
        run: |
          VER="$(./src/smartdns -v | awk '{print $2}')"
          PKG="smartdns-${VER}-${{ matrix.label }}.zip"
          echo "PKG=${PKG}" >> "$GITHUB_ENV"
          echo "PKG_BASE=${PKG%.zip}" >> "$GITHUB_ENV"
          file src/smartdns plugin/smartdns-ui/target/smartdns_ui.so
          echo "== dynamic dependencies (libc/libgcc_s only, by design) =="
          ldd src/smartdns || true
          ldd plugin/smartdns-ui/target/smartdns_ui.so || true
          # The /opt dependencies are static-only builds, so the binary
          # must not NEED any ssl/crypto/curl/z/compression shared lib;
          # only libc/libgcc_s/libm may stay dynamic (dlopen plugins).
          # Check readelf's NEEDED list, not ldd (transitive entries).
          if readelf -d src/smartdns | grep -E "NEEDED.*(libssl|libcrypto|libcurl|libz\.|libzstd|libbrotli)"; then
            echo "ERROR: binary still depends on a dynamic ssl/curl/z library" >&2
            exit 1
          fi
          mkdir -p dist
          cp src/smartdns plugin/smartdns-ui/target/smartdns_ui.so dist/
          (cd dist && zip -9 "../${PKG}" smartdns smartdns_ui.so)
          unzip -l "${PKG}"

      - name: Upload zip as artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.PKG_BASE }}
          path: ${{ env.PKG }}
          if-no-files-found: error

      - name: Attach zip to nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh shells out to git; inside the musl container git refuses
          # the checkout over ownership, so mark it safe first.
          git config --global --add safe.directory "${GITHUB_WORKSPACE}" || true
          gh release view nightly >/dev/null 2>&1 || \
            gh release create nightly --prerelease \
              --title "Nightly builds" \
              --notes "Automated nightly and manual builds."
          gh release upload nightly "${PKG}" --clobber
