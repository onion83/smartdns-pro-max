bind :53 -no-cache -no-speed-check

log-console yes
log-level debug
cache-size 0
speed-check-mode none

server 119.29.29.29 -g default

server 223.5.5.5 -g cn -e
server 8.8.8.8   -g free -e

geosite-dat tencent /smartdns/data/tencent.list 5
geosite-dat google  /smartdns/data/google.list 5
geosite-dat sina    /smartdns/data/sina.list 5
geosite-dat blibli  https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/biliintl.list 30 


geosite-set cn-services tencent sina blibli        
geosite-set search-services google           

domain-rules /geosite-set:cn-services/ -n cn 
domain-rules /geosite-set:search-services/ -n free 


