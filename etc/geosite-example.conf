# geosite 配置示例
# 
# 1. geosite-dat - 定义一个 geosite 数据源
#    格式: geosite-dat <名称> <文件路径或URL> [更新间隔(秒)]
#    例: geosite-dat tencent /path/to/tencent.list 600
#    例: geosite-dat google https://example.com/google.list 600
#
# 2. geosite-set - 定义一个 geosite 集合（由多个 geosite-dat 组合）
#    格式: geosite-set <集合名称> <geosite-dat名称>...
#    例: geosite-set search google baidu bing
#
# 3. 在 domain-rules 中使用 geosite-set
#    格式: domain-rules domain-set:<geosite-set名称> -n <服务器组>

# 示例 1: 本地文件
geosite-dat tencent /Users/onion/C/smartdns/data/tencent.list 600

# 示例 2: 另一个本地文件
geosite-dat sina /Users/onion/C/smartdns/data/sina.list 600

# 示例 3: 定义一个 geosite-set
geosite-set blocklist tencent sina

# 示例 4: 在 domain-rules 中使用
# domain-rules domain-set:blocklist -n block
